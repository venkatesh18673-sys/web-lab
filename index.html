<section data-t="6. Write a JavaScript code to illustrate the use of arithmetic operators">
<textarea data-n="AO.html">
<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Arithmetic Operators Example</title>
 <style>
 body {
 font-family: Arial, sans-serif;
 margin: 20px;
 }
 .result {
 margin-top: 10px;
 }
 </style>
</head>
<body>
 <h1>Arithmetic Operators Example</h1>
 <script>
 // Define two numbers
 let num1 = 10;
 let num2 = 5;
 // Perform arithmetic operations
 let sum = num1 + num2; // Addition
 let difference = num1 - num2; // Subtraction
 let product = num1 * num2; // Multiplication
 let quotient = num1 / num2; // Division
 let remainder = num1 % num2; // Modulus
 // Display results on the webpage
 document.write("<div class='result'>Number 1: " + num1 + "</div>");
 document.write("<div class='result'>Number 2: " + num2 + "</div>");
 document.write("<div class='result'>Addition: " + sum + "</div>");
 document.write("<div class='result'>Subtraction: " + difference + "</div>");
 document.write("<div class='result'>Multiplication: " + product + "</div>");
 document.write("<div class='result'>Division: " + quotient + "</div>");
 document.write("<div class='result'>Modulus: " + remainder + "</div>");
 // Display results in the console
 console.log("Number 1: " + num1);
 console.log("Number 2: " + num2);
 console.log("Addition: " + sum); // 10 + 5 = 15
 console.log("Subtraction: " + difference); // 10 - 5 = 5
 console.log("Multiplication: " + product); // 10 * 5 = 50
 console.log("Division: " + quotient); // 10 / 5 = 2
 console.log("Modulus: " + remainder); // 10 % 5 = 0
 </script>
</body>
</html>
</textarea></section>

<section data-t="7. Write a JavaScript code to guess a random number.">
<textarea data-n="random.html">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess the Number</title>
<style>
body {
font-family: Arial, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
background-color: #f4f4f4;
}
#game {
text-align: center;
}
</style>
</head>
<body>
<div id="game">
<h1>Guess the Number</h1>
<p>Guess a number between 1 and 10:</p>
<input type="number" id="guessInput" min="1" max="10">
<button id="submitGuess">Submit Guess</button>
<p id="result"></p>
</div>
<script src="script.js"></script>
</body>
</html>
</textarea>
<textarea data-n="script.js">
//script.js
document.addEventListener('DOMContentLoaded', () => {
const random = Math.floor(Math.random() * 10) + 1;
const guessInput = document.getElementById('guessInput');
const submitGuess = document.getElementById('submitGuess');
const result = document.getElementById('result');
function handleGuess() {
const userGuess = parseInt(guessInput.value);
if (userGuess === random) {
result.textContent = 'Congratulations! You guessed the correct number.';
result.style.color = 'green';
} else if (userGuess < 1 || userGuess > 10 || isNaN(userGuess)) {
result.textContent = 'Please enter a number between 1 and 10.';
result.style.color = 'red';
} else {
result.textContent = 'Try again!';
result.style.color = 'red';
}
}
submitGuess.addEventListener('click', handleGuess);
});
</textarea></section>

<section data-t="8. Write a JavaScript code to check if an array contains a specified value.">
<textarea data-n="findValue.html">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Array Value Check</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 20px;
}
</style>
</head>
<body>
<h1>Check if Array Contains a Specified Value</h1>
<p id="result"></p>
<script>
// Function to check if an array contains a specified value
function containsValue(array, value) {
return array.includes(value);
}
// Example array and value to check
const myArray = [1, 2, 3, 4, 5];
const valueToCheck = 6;
// Check if the value is in the array and display the result
const resultElement = document.getElementById('result');
if (containsValue(myArray, valueToCheck)) {
resultElement.textContent = `${valueToCheck} is in the array.`;
} else {
resultElement.textContent = `${valueToCheck} is not in the array.`;
}
</script>
</body>
</html>
</textarea></section>

// app.js
var app = angular.module('myApp', []);
// Define a Controller
app.controller('MainController', function() {
this.data = {
text: 'Hello World!',
number: 123456.789,
date: new Date(),
jsonData: { name: 'John Doe', age: 30 }
};
});
// Define a Custom Directive
app.directive('myDirective', function() {
return {
restrict: 'E',
template: `
<div>
<p><strong>Original Text:</strong> {{ ctrl.data.text }}</p>
<p><strong>Uppercase Text:</strong> {{ ctrl.data.text | uppercase }}</p>
<p><strong>Formatted Number:</strong> {{ ctrl.data.number | number:2 }}</p>
<p><strong>Short Date:</strong> {{ ctrl.data.date | date:'shortDate' }}</p>
<p><strong>JSON Data:</strong> {{ ctrl.data.jsonData | json }}</p>
<p><strong>Currency Format:</strong> {{ ctrl.data.number | currency:'$' }}</p>
</div>
`,
controller: 'MainController',
controllerAs: 'ctrl'
};
});
</textarea></section>

<textarea data-n="app.js">
// app.js
angular.module('notepadApp', []).controller('NotepadController', function($scope) {
$scope.notes = [];
$scope.newNote = '';
$scope.addNote = function() {
if ($scope.newNote) {
$scope.notes.push({ text: $scope.newNote });
$scope.newNote = ''; // Clear the input field
}
};
$scope.editNote = function(note) {
const editedNote = prompt("Edit your note:", note.text);
if (editedNote !== null) {
note.text = editedNote;
}
};
$scope.deleteNote = function(note) {
const index = $scope.notes.indexOf(note);
if (index !== -1) {
$scope.notes.splice(index, 1);
}
};
});
</textarea></section>

<script>
var nav=document.getElementById('nav'),main=document.getElementById('main');
function copy(text,btn){
function done(){btn.textContent='Copied!';btn.classList.add('ok');setTimeout(function(){btn.textContent='Copy';btn.classList.remove('ok')},1500)}
function fb(){var t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){btn.textContent='Press Ctrl+C'}document.body.removeChild(t)}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb)}else fb();
}
document.querySelectorAll('#data section').forEach(function(s,i){
var sec=document.createElement('section');sec.id='p'+(i+1);
var h=document.createElement('h2');h.textContent=s.dataset.t;sec.appendChild(h);
s.querySelectorAll('textarea').forEach(function(ta){
var code=ta.value.replace(/^\n/,'').replace(/\s+$/,'')+'\n';
var f=document.createElement('div');f.className='f';
var hd=document.createElement('div');hd.className='fh';
var nm=document.createElement('span');nm.textContent=ta.dataset.n;
var b=document.createElement('button');b.textContent='Copy';b.onclick=function(){copy(code,b)};
hd.appendChild(nm);hd.appendChild(b);
var pre=document.createElement('pre');pre.textContent=code;
f.appendChild(hd);f.appendChild(pre);sec.appendChild(f);
});
main.appendChild(sec);
var a=document.createElement('a');a.href='#p'+(i+1);a.textContent=i+1;a.setAttribute('aria-label','Program '+(i+1));nav.appendChild(a);
});
document.getElementById('data').remove();
</script>
